name: Günlük Fon Güncellemesi

on:
  schedule:
    - cron: '30 07 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fon-verisi-cek:
    runs-on: ubuntu-latest
    
    steps:
    - name: Depoyu Kontrol Et
      uses: actions/checkout@v3

    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Kütüphaneleri Yükle
      run: |
        pip install -r requirements.txt

    - name: Scripti Çalıştır
      run: python main.py

    - name: Dosya Kontrolü ve Kayıt
      run: |
        # Dosya oluşmuş mu kontrol et
        if [ -f guncel_fonlar.csv ]; then
          git config --global user.name 'GitHub Action Bot'
          git config --global user.email 'action@github.com'
          git add guncel_fonlar.csv
          # Sadece değişiklik varsa commit et, yoksa hata verme
          git diff --quiet && git diff --staged --quiet || (git commit -m "Günlük Güncelleme" && git push)
        else
          echo "DİKKAT: CSV dosyası oluşmadı, kayıt atlanıyor."
        fi
