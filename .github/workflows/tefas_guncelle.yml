name: TEFAS Güncellemesi (Otomatik ve Manuel)

on:
  # 1. OTOMATİK ZAMANLAMA
  schedule:
    # UTC saatiyle 19:00 = Türkiye saatiyle 22:00
    - cron: '0 19 * * *'
  
  # 2. MANUEL TETİKLEME BUTONU
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Yazma izni şart

    steps:
      - name: Depoyu Çek (Checkout)
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Kütüphaneleri Yükle
        run: |
          pip install selenium

      - name: Python Kodunu Çalıştır
        run: python main.py

      - name: Değişiklikleri Kaydet ve Gönder
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Dosya değişmiş mi kontrol et
          if [[ -n $(git status -s) ]]; then
            echo "Değişiklik var, kaydediliyor..."
            git add guncel_fonlar.csv
            git commit -m "Otomatik Güncelleme: Fon Fiyatları"
            
            # HATA ALMAMAK İÇİN ÖNCE GÜNCEL HALİ ÇEK (Rebase)
            git pull --rebase origin main
            
            # SONRA GÖNDER
            git push
          else
            echo "Değişiklik yok, işlem pas geçildi."
          fi
